<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Adhérents - Bibliothèque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <span class="navbar-marque">As Bibliothèque </span>
        <div class="navbar-liens">
            <a href="index.html">Accueil</a>
            <a href="livres.html">Livres</a>
            <a href="auteurs.html">Auteurs</a>
            <a href="emprunts.html">Emprunts</a>
        </div>
        <div class="navbar-utilisateur">
            <span id="nomUtilisateur"></span>
            <button onclick="deconnexion()">Déconnexion</button>
        </div>
    </nav>

    <main class="section-page">
        <h1>Adhérents</h1>

        <form id="formAjoutAdherent" class="formulaire-inline" onsubmit="return false;">
            <input type="text" id="nom" placeholder="Nom" required>
            <input type="text" id="prenom" placeholder="Prénom" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="mot_de_passe" placeholder="Mot de passe initial" required>
            <button type="submit">Ajouter</button>
        </form>
        <p id="messageAdherent"></p>

        <table class="tableau-donnees">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="corpsTableauAdherents">
                <tr><td colspan="4">Chargement...</td></tr>
            </tbody>
        </table>

        <div id="panneauHistorique" class="panneau-historique" style="display: none;">
            <h2>Historique des emprunts — <span id="nomAdherentHistorique"></span></h2>
            <button onclick="fermerHistorique()" class="bouton-fermer">Fermer</button>
            <table class="tableau-donnees">
                <thead>
                    <tr>
                        <th>Livre</th>
                        <th>Date d'emprunt</th>
                        <th>Retour prévu</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="corpsHistorique"></tbody>
            </table>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/adherents.js"></script>
</body>
</html>
